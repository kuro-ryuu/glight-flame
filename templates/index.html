<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flight Game</title>
  <link rel="stylesheet" href="app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="base">
  <div class="hint">
    <br><div class="controls">Controls:</div>
    <br>Movement: A / D or ArrowLeft / ArrowRight
    <br>Space: Pause.
    <br>Q: Quit.
  </div>
  <div class="game-area">
    <h1>Flight Game</h1>
    <pre id="frame">Loading...</pre>
  </div>
  </div>
  <script>
    const addr="http://127.0.0.1:5000";
    const frameEl = document.getElementById('frame');
    async function fetchFrame(){
      try {
        const r = await fetch(addr + '/frame');
        const t = await r.text();
        frameEl.textContent = t || '';
      } catch(e){
        frameEl.textContent = 'Error fetching frame';
      }
    }
    setInterval(fetchFrame, 150);
    fetchFrame();

    window.addEventListener('keydown', (e)=>{
      let key = e.key;
      if (key === 'ArrowLeft') key = 'left';
      if (key === 'ArrowRight') key = 'right';
      if (key === ' ') key = 'space';
      key = key.toLowerCase();
      fetch(addr + '/key', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({key})});
      e.preventDefault();
    });
  </script>
</body>
</html>
